spring:
  config:
    import: classpath:external-apis.yml
  profiles:
    active:  ${PROFILE}
  application:
    name: predo-allotment-schedule
server:
  port: 8081
  servlet:
    context-path: /predo-allotment-schedule
http:
  connection:
    read-timeout: 50000
    server-connect-timeout: 2000
  management:
    endpoints:
      web:
        exposure:
          include: health

    endpoint:
      health:
        probes:
          enabled: true
        show-details: always

    health:
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true





